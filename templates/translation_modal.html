<!-- Translation Modal with Two-Box Interface -->
<div class="modal fade" id="translationModal" tabindex="-1" aria-labelledby="translationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="translationModalLabel">Direct Two-Box Translation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted">Use this simplified interface for direct translation between any two languages.</p>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="sourceLanguage" class="form-label">Source Language:</label>
                        <select class="form-select" id="sourceLanguage">
                            <option value="auto" selected>Auto-detect</option>
                            <option value="en">English</option>
                            <option value="es">Spanish (Español)</option>
                            <option value="fr">French (Français)</option>
                            <option value="de">German (Deutsch)</option>
                            <option value="it">Italian (Italiano)</option>
                            <option value="pt">Portuguese (Português)</option>
                            <option value="nl">Dutch (Nederlands)</option>
                            <option value="ru">Russian (Русский)</option>
                            <option value="zh">Chinese (中文)</option>
                            <option value="ja">Japanese (日本語)</option>
                            <option value="ko">Korean (한국어)</option>
                            <option value="ar">Arabic (العربية)</option>
                            <option value="hi">Hindi (हिन्दी)</option>
                            <option value="bn">Bengali (বাংলা)</option>
                            <option value="tr">Turkish (Türkçe)</option>
                            <option value="vi">Vietnamese (Tiếng Việt)</option>
                            <option value="th">Thai (ไทย)</option>
                            <option value="id">Indonesian (Bahasa Indonesia)</option>
                            <option value="pl">Polish (Polski)</option>
                            <option value="sv">Swedish (Svenska)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="targetLanguageModal" class="form-label">Target Language:</label>
                        <select class="form-select" id="targetLanguageModal">
                            <option value="en">English</option>
                            <option value="es">Spanish (Español)</option>
                            <option value="fr">French (Français)</option>
                            <option value="de">German (Deutsch)</option>
                            <option value="it">Italian (Italiano)</option>
                            <option value="pt">Portuguese (Português)</option>
                            <option value="nl">Dutch (Nederlands)</option>
                            <option value="ru">Russian (Русский)</option>
                            <option value="zh">Chinese (中文)</option>
                            <option value="ja">Japanese (日本語)</option>
                            <option value="ko">Korean (한국어)</option>
                            <option value="ar">Arabic (العربية)</option>
                            <option value="hi">Hindi (हिन्दी)</option>
                            <option value="bn">Bengali (বাংলা)</option>
                            <option value="tr">Turkish (Türkçe)</option>
                            <option value="vi">Vietnamese (Tiếng Việt)</option>
                            <option value="th">Thai (ไทย)</option>
                            <option value="id">Indonesian (Bahasa Indonesia)</option>
                            <option value="pl">Polish (Polski)</option>
                            <option value="sv">Swedish (Svenska)</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="aiProviderTranslationModal" class="form-label">AI Provider:</label>
                    <select class="form-select" id="aiProviderTranslationModal">
                        <option value="">Auto (Default)</option>
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="perplexity">Perplexity</option>
                        <option value="deepseek">DeepSeek</option>
                    </select>
                    <div class="form-text">Select the AI provider to use for direct translation processing</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success btn-lg" id="startModalTranslationBtn">
                    <i class="bi bi-translate"></i> Translate Now
                </button>
            </div>
        </div>
    </div>
</div>
